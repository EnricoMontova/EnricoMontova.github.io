<script>


// relógio da barra de cima
(function () {
  var el = document.getElementById('hora');
  var p = function (n) { return (n < 10 ? '0' : '') + n; };
  function tick() { var d = new Date(); el.textContent = p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds()); }
  tick(); setInterval(tick, 1000);
})();

// a barra de baixo responde como um terminal ao passar pelos links
(function () {
  var status = document.getElementById('status'), padrao = 'Selecione uma seção';
  var links = document.querySelectorAll('[data-alvo]');
  for (var i = 0; i < links.length; i++) {
    (function (a) {
      var mira = function () { status.textContent = '> abrir ' + a.getAttribute('data-alvo'); };
      var solta = function () { status.textContent = padrao; };
      a.addEventListener('mouseenter', mira); a.addEventListener('focus', mira);
      a.addEventListener('mouseleave', solta); a.addEventListener('blur', solta);
    })(links[i]);
  }
})();

// transição "escaneamento de xerox": a página chega coberta pelo papel e o scanner a revela;
// ao clicar num link marcado, o scanner desce cobrindo a página e só então abre a próxima
(function () {
  var rm = false;
  try { rm = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
  var capa = document.getElementById('capa'), barra = document.getElementById('barra'), msg = document.getElementById('capa-msg');
  if (!capa || !barra) return;
  var suave = function (x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
  function animar(dur, atraso, aplicar, fim) {
    var inicio = null;
    function passo(agora) {
      if (inicio === null) inicio = agora;
      var p = Math.min(1, Math.max(0, (agora - inicio - atraso) / dur));
      aplicar(suave(p), p);
      if (p < 1) requestAnimationFrame(passo); else if (fim) fim();
    }
    requestAnimationFrame(passo);
  }
  function esconder() { capa.style.display = 'none'; barra.style.display = 'none'; }
  if (!rm) {
    try { var m = sessionStorage.getItem('scan-msg'); sessionStorage.removeItem('scan-msg'); if (m) msg.textContent = m; } catch (e) {}
    animar(950, 250, function (e, p) {
      capa.style.clipPath = 'inset(' + (e * 100).toFixed(2) + '% 0 0 0)';
      barra.style.top = (e * 100).toFixed(2) + '%';
      barra.style.opacity = p > 0.94 ? String(Math.max(0, (1 - p) / 0.06)) : '1';
    }, esconder);
    setTimeout(esconder, 3000);
  }
  var links = document.querySelectorAll('a[data-transicao]');
  for (var i = 0; i < links.length; i++) {
    links[i].addEventListener('click', function (ev) {
      if (rm || ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.button !== 0) return;
      ev.preventDefault();
      var destino = this.getAttribute('href'), texto = this.getAttribute('data-transicao');
      try { sessionStorage.setItem('scan-msg', texto); } catch (e) {}
      msg.textContent = texto;
      capa.style.clipPath = 'inset(0 0 100% 0)';
      capa.style.display = 'flex'; barra.style.display = 'block'; barra.style.opacity = '1';
      animar(700, 0, function (e) {
        capa.style.clipPath = 'inset(0 0 ' + ((1 - e) * 100).toFixed(2) + '% 0)';
        barra.style.top = (e * 100).toFixed(2) + '%';
      }, function () { window.location.href = destino; });
    });
  }
})();

</script>
